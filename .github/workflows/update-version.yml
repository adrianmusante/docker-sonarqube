name: Update Version

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  DEPENDENCY_NAME: SonarQube
  DOCKERFILE_PATH: sonarqube/Dockerfile
  DOCKERFILE_VERSION_KEY: SONARQUBE_VERSION
  DOCKERFILE_PR_PLUGIN_VERSION_KEY: SONARQUBE_PR_PLUGIN_VERSION
  DOCKERFILE_OS_VERSION_KEY: DEBIAN_VERSION

jobs:
  update-version:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.BOT_GH_TOKEN != '' && secrets.BOT_GH_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ env.GH_TOKEN }}
      - name: Configure Git user
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - name: Get current version
        id: get-current
        run: |
          get_version() { grep "ARG $1=" "$DOCKERFILE_PATH" | cut -d '=' -f2 | tr -d '[:space:]'; }
          pr_plugin_version="$(get_version "$DOCKERFILE_PR_PLUGIN_VERSION_KEY")"
          version="$(get_version "$DOCKERFILE_VERSION_KEY")"
          os_version="$(get_version "$DOCKERFILE_OS_VERSION_KEY")"
          
          echo "Current version: $version (pr plugin: $pr_plugin_version, os: $os_version)" >> $GITHUB_STEP_SUMMARY
          echo "pr_plugin_version=$pr_plugin_version" >> $GITHUB_OUTPUT
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "os_version=$os_version" >> $GITHUB_OUTPUT
      - name: Get latest version
        id: get-latest
        run: |
          # Retrieve latest pr plugin version
          pr_plugin_version="$(curl -sSfL -H 'Authorization: Bearer ${{ env.GH_TOKEN }}' https://api.github.com/repos/mc1arke/sonarqube-community-branch-plugin/releases/latest | json_pp | grep '"tag_name"' | cut -d '"' -f4 | tr -d '\\n' | tr -d 'v')"
          if [ -z "$pr_plugin_version" ]; then echo "Failed to fetch latest version" >&2; exit 1 ; fi
          
          # Retrieve SonarQube compilation version by pr plugin version
          get_sonarqube_version() { curl -sSfL -H 'Authorization: Bearer ${{ env.GH_TOKEN }}' "https://api.github.com/repos/SonarSource/sonarqube/releases?per_page=100" | json_pp  | grep '"tag_name"' | cut -d '"' -f4  | grep "^$(echo "$1." | sed 's/\./\\./g')" | head -n 1 | grep -oE '[0-9]+(\.[0-9]+)+' || echo ""; }
          version="$(get_sonarqube_version "$pr_plugin_version")"
          if [ -z "$version" ]; then
            version="$(get_sonarqube_version "$(echo "$pr_plugin_version" | cut -d'.' -f1,2)")"
            if [ -z "$version" ]; then
              version="${{ steps.get-current.outputs.version }}"
              echo "::warning::Failed to fetch SonarQube version for pr plugin version $pr_plugin_version. Using existing version: $version"
            else
              echo "::warning::Using minor version match for SonarQube version: $version"
            fi
          fi
          
          # Retrieve OS version
          os_version="$(curl -sSfL https://deb.debian.org/debian/dists/stable/Release | grep Codename | awk '{print $2}')-slim"
          docker_debian_tag_status=$(curl -s -o /dev/null -w "%{http_code}" "https://hub.docker.com/v2/repositories/library/debian/tags/$os_version/")
          if [ "$docker_debian_tag_status" -ne 200 ]; then
            os_version="${{ steps.get-current.outputs.os_version }}"
            echo "::warning::Failed to fetch latest Debian version, using existing version: $os_version"
          fi
          
          echo "Latest version: $version (pr plugin: $pr_plugin_version, os: $os_version)" >> $GITHUB_STEP_SUMMARY
          echo "pr_plugin_version=$pr_plugin_version" >> $GITHUB_OUTPUT
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "os_version=$os_version" >> $GITHUB_OUTPUT
      - name: Check if update is needed
        id: check
        run: |
          if [ "${{ steps.get-latest.outputs.version }}" = "${{ steps.get-current.outputs.version }}" ] \
            && [ "${{ steps.get-latest.outputs.pr_plugin_version }}" = "${{ steps.get-current.outputs.pr_plugin_version }}" ] \
            && [ "${{ steps.get-latest.outputs.os_version }}" = "${{ steps.get-current.outputs.os_version }}" ]; then
              echo "up_to_date=true" >> $GITHUB_OUTPUT
            else
              echo "up_to_date=false" >> $GITHUB_OUTPUT
          fi
      - name: Pull request metadata
        if: steps.check.outputs.up_to_date == 'false'
        id: pr
        run: |
          cur_version="${{ steps.get-current.outputs.version }}"
          cur_pr_plugin="${{ steps.get-current.outputs.pr_plugin_version }}"
          cur_os="${{ steps.get-current.outputs.os_version }}"
          new_version="${{ steps.get-latest.outputs.version }}"
          new_pr_plugin="${{ steps.get-latest.outputs.pr_plugin_version }}"
          new_os="${{ steps.get-latest.outputs.os_version }}"

          title_parts=()
          body_lines=()
          branch_parts=()

          if [ "$cur_version" != "$new_version" ]; then
            title_parts+=("$DEPENDENCY_NAME to v$new_version")
            body_lines+=("- $DEPENDENCY_NAME: $cur_version → $new_version")
            branch_parts+=("sonarqube-$new_version")
          fi
          if [ "$cur_pr_plugin" != "$new_pr_plugin" ]; then
            title_parts+=("PR plugin to $new_pr_plugin")
            body_lines+=("- PR plugin: $cur_pr_plugin → $new_pr_plugin")
            branch_parts+=("pr-plugin-$new_pr_plugin")
          fi
          if [ "$cur_os" != "$new_os" ]; then
            title_parts+=("Debian to $new_os")
            body_lines+=("- Debian: $cur_os → $new_os")
            branch_parts+=("debian-$new_os")
          fi

          # Join title parts: "A", "A and B", or "A, B, and C"
          title="Update "
          n=${#title_parts[@]}
          for i in "${!title_parts[@]}"; do
            if [ "$i" -eq 0 ]; then
              title+="${title_parts[$i]}"
            elif [ "$i" -eq $((n - 1)) ]; then
              if [ "$n" -gt 2 ]; then
                title+=", and ${title_parts[$i]}"
              else
                title+=" and ${title_parts[$i]}"
              fi
            else
              title+=", ${title_parts[$i]}"
            fi
          done

          body="Updates the following dependencies:"$'\n\n'
          for line in "${body_lines[@]}"; do
            body+="$line"$'\n'
          done

          branch_slug="$(IFS=-; echo "${branch_parts[*]}")"
          branch="update/$branch_slug"

          prs=$(gh pr list --search "$title" --json title | jq length)
          if [ "$prs" -gt 0 ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

          {
            echo "title=$title"
            echo "commit_message=$title"
            echo "head_branch=$branch"
            echo "base_branch=main"
            echo "body<<EOF"
            printf '%s' "$body"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Create Pull Request
        if: steps.pr.outputs.exists == 'false' && steps.check.outputs.up_to_date == 'false'
        run: |
          version="${{ steps.get-latest.outputs.version }}"
          branch="${{ steps.pr.outputs.head_branch }}"
          git checkout -b "$branch"
          update_dockerfile_version() { sed -i "s|ARG $1=.*|ARG $1=$2|" "$DOCKERFILE_PATH"; } 
          update_dockerfile_version "$DOCKERFILE_VERSION_KEY" "$version"
          update_dockerfile_version "$DOCKERFILE_PR_PLUGIN_VERSION_KEY" "${{ steps.get-latest.outputs.pr_plugin_version }}"
          update_dockerfile_version "$DOCKERFILE_OS_VERSION_KEY" "${{ steps.get-latest.outputs.os_version }}"
          sed -i -E "s|-\s*\[\`[0-9]+\`,\s*\`[0-9.]+\`,\s*\`latest\` \(${DOCKERFILE_PATH}\)\]|- [\`$(echo "$version" | cut -d'.' -f1,1)\`, \`$(echo "$version" | cut -d'.' -f1,2)\`, \`latest\` (${DOCKERFILE_PATH})]|" README.md
          git commit -am "${{ steps.pr.outputs.commit_message }}"
          git push origin "$branch"
          gh pr create --title "${{ steps.pr.outputs.title }}" \
            --body "${{ steps.pr.outputs.body }}" \
            --base "${{ steps.pr.outputs.base_branch }}" --head "$branch"